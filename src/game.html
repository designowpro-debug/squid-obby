<head>

<title>魷魚遊戲 闖關挑戰 (Squid Obby)</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#111;position:fixed;inset:0;
    overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;font-family:"PingFang TC","Heiti TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;}
  #app,canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  .hud{position:fixed;z-index:5;pointer-events:none;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;}
  #hudL{top:calc(10px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));font-size:16px;line-height:1.5;
    background:rgba(0,0,0,.35);padding:8px 12px;border-radius:12px;font-weight:700}
  #hudL .lv{font-size:18px;color:#ffd23f}
  #light{top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:30px;font-weight:900;
    padding:6px 26px;border-radius:40px;display:none;border:4px solid #fff}
  #light.green{background:#1ec95a;display:block}
  #light.red{background:#e8202a;display:block}
  #light.turn{background:#f2a516;display:block}
  #cd{top:calc(66px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:24px;font-weight:900;display:none}
  #msg{top:38%;left:50%;transform:translate(-50%,-50%);font-size:min(12vw,72px);font-weight:900;text-align:center;
    display:none;white-space:nowrap;letter-spacing:4px}
  #msg small{display:block;font-size:22px;letter-spacing:1px}
  #flash{position:fixed;inset:0;background:#f00;opacity:0;pointer-events:none;z-index:4;transition:opacity .4s}
  .screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%,rgba(232,51,109,.92),rgba(40,10,30,.96));color:#fff;text-align:center;padding:20px;box-sizing:border-box}
  .screen h1{font-size:min(11vw,64px);margin:0 0 6px;text-shadow:0 5px 0 #000;letter-spacing:3px}
  .screen .shapes{font-size:min(10vw,54px);letter-spacing:18px;margin-bottom:6px}
  .screen p{margin:4px 0;font-size:17px;max-width:620px;line-height:1.55}
  .btn{pointer-events:auto;margin-top:18px;font-size:28px;font-weight:900;padding:14px 46px;border-radius:18px;border:4px solid #fff;
    background:#1ec95a;color:#fff;box-shadow:0 6px 0 #0a6b2c;cursor:pointer;font-family:inherit;touch-action:manipulation}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0a6b2c}
  .hidden{display:none!important}
  #touch{position:fixed;inset:0;z-index:6;pointer-events:none;display:none}
  #touch.on{display:block}
  #joy{position:absolute;left:calc(28px + env(safe-area-inset-left));bottom:calc(28px + env(safe-area-inset-bottom));width:160px;height:160px;
    border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:rgba(255,255,255,.75);
    box-shadow:0 3px 8px rgba(0,0,0,.4)}
  #jumpBtn{position:absolute;right:calc(34px + env(safe-area-inset-right));bottom:calc(40px + env(safe-area-inset-bottom));width:110px;height:110px;
    border-radius:50%;background:rgba(30,201,90,.75);border:4px solid #fff;color:#fff;font-size:32px;font-weight:900;display:flex;
    align-items:center;justify-content:center;pointer-events:auto;touch-action:none;text-shadow:0 2px 0 #000}
  #jumpBtn.pressed{background:rgba(20,150,60,.95);transform:scale(.94)}
  #camHint{position:absolute;right:calc(30px + env(safe-area-inset-right));bottom:calc(165px + env(safe-area-inset-bottom));color:#fff;opacity:.7;font-size:14px;text-shadow:0 1px 2px #000}
  #charScreen .cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .card{pointer-events:auto;cursor:pointer;width:min(29vw,250px);background:rgba(0,0,0,.45);border:4px solid #fff;border-radius:20px;padding:10px 10px 14px;
    box-sizing:border-box;text-align:center;touch-action:manipulation;transition:transform .12s}
  .card:active{transform:scale(.96)}
  .card img{width:100%;aspect-ratio:6/7;object-fit:contain;background:linear-gradient(#8fd3ff,#e8c98a);border-radius:12px;display:block}
  .card h2{margin:8px 0 4px;font-size:26px}
  .card .row{display:flex;align-items:center;justify-content:space-between;font-size:15px;margin:3px 2px}
  .card .bar{flex:1;margin-left:8px;height:10px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden}
  .card .bar i{display:block;height:100%;background:#ffd23f}
  .card .ab{margin-top:6px;font-size:14px;line-height:1.4;min-height:40px}
  .card .tag{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:10px;font-size:13px;font-weight:700}
  #stam{width:120px;height:8px;background:rgba(255,255,255,.25);border-radius:5px;overflow:hidden;margin-top:4px}
  #stam i{display:block;height:100%;width:100%;background:#ff9f2e}
  #dashBtn{position:absolute;right:calc(160px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));width:90px;height:90px;
    border-radius:50%;background:rgba(255,159,46,.8);border:4px solid #fff;color:#fff;font-size:28px;font-weight:900;display:flex;
    align-items:center;justify-content:center;pointer-events:auto;touch-action:none;text-shadow:0 2px 0 #000}
  #dashBtn.pressed{background:rgba(220,110,10,.95);transform:scale(.94)}
  #hp{width:170px;height:14px;background:rgba(0,0,0,.45);border:2px solid #fff;border-radius:8px;overflow:hidden;margin:2px 0 4px}
  #hpFill{display:block;height:100%;width:100%;background:#1ec95a;transition:width .25s}
  #hpWrap.shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #pop{top:30%;left:50%;transform:translate(-50%,0);font-size:40px;font-weight:900;opacity:0}
  #pop.show{animation:pop 0.9s ease-out}
  @keyframes pop{0%{opacity:1;transform:translate(-50%,10px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
  #restartTop{position:fixed;z-index:7;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));font-size:15px;
    padding:8px 12px;border-radius:12px;border:2px solid #fff;background:rgba(0,0,0,.4);color:#fff;font-family:inherit;font-weight:700;touch-action:manipulation}
</style>
</head>
<body>
<div id="app"></div>
<div id="flash"></div>
<div id="hudL" class="hud hidden"><div class="lv" id="lvName">第 1 關</div><div id="hpWrap">❤️ 生命 <span id="hpNum">100</span><div id="hp"><i id="hpFill"></i></div></div><div>💀 淘汰次數：<span id="deaths">0</span></div><div>⏱ 總時間：<span id="time">0.0</span> 秒</div><div>🧍 角色：<span id="charName">菜鳥</span></div><div id="stamWrap" class="hidden">⚡ 體力<div id="stam"><i id="stamFill"></i></div></div></div>

<div id="touch"><div id="joy"><div id="knob"></div></div><div id="camHint">拖曳畫面轉視角</div><div id="jumpBtn">跳</div><div id="dashBtn" class="hidden">衝</div></div>

<div id="startScreen" class="screen">
  <div class="shapes">○△□</div>
  <h1>魷魚遊戲 闖關挑戰</h1>
  <p>五道跳躍關卡：<b>跳格子踏石</b> → <b>玻璃橋</b> → <b>椪糖跳台</b> → <b>彈珠迴旋</b> → <b>魷魚決戰</b>，活著抵達終點！掉下去會回到檢查點 🚩</p>
  <p>⌨️ 電腦：WASD／方向鍵移動、空白鍵跳躍（培根頭可二段跳）、Shift 衝刺（小咔啦）、滑鼠拖曳轉動視角</p>
  <p>📱 平板／手機：左下搖桿移動、右下「跳」按鈕、「衝」按鈕（小咔啦）、拖曳畫面轉動視角</p>
  <button class="btn" id="startBtn">開始遊戲</button>
</div>
<div id="charScreen" class="screen hidden">
  <h1 style="font-size:min(9vw,48px)">選擇角色</h1>
  <p>點選一位角色開始挑戰（五道關卡）</p>
  <div class="cards" id="cards"></div>
</div>
<div id="winScreen" class="screen hidden">
  <div class="shapes">🏆</div>
  <h1>恭喜通關！</h1>
  <p style="font-size:24px">總時間：<b id="winTime">0</b></p>
  <p style="font-size:24px">淘汰次數：<b id="winDeaths">0</b></p>
  <button class="btn" id="againBtn">再玩一次（重選角色）</button>
</div>

<script>/*THREE_JS*/</script>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || params.has('touch');

// ---------- prevent page scroll / zoom (iPad Safari) ----------
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));
document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouchEnd < 300 && e.target.tagName !== 'BUTTON') e.preventDefault(); lastTouchEnd = n; }, {passive:false});
document.addEventListener('contextmenu', e => e.preventDefault());

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({antialias: !isTouch || devicePixelRatio < 2, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
$('app').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 500);
const hemi = new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
const sc = sun.shadow.camera; sc.left = -30; sc.right = 30; sc.top = 30; sc.bottom = -30; sc.near = 1; sc.far = 120;
sun.shadow.bias = -0.0008;
scene.add(sun); scene.add(sun.target);

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < h ? 75 : 60;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

// ---------- helpers ----------
const unitBox = new THREE.BoxGeometry(1,1,1);
const R = 0.45;
const matCache = {};
function mat(color){ if(!matCache[color]) matCache[color] = new THREE.MeshLambertMaterial({color}); return matCache[color]; }
function box(w,h,d,color,x=0,y=0,z=0,parent=null,material=null){
  const m = new THREE.Mesh(unitBox, material || mat(color));
  m.scale.set(w,h,d); m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
function textTexture(text, fg='#fff', bg=null, w=128, h=64, font='bold 44px sans-serif'){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  if (bg){ g.fillStyle = bg; g.fillRect(0,0,w,h); }
  g.fillStyle = fg; g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, w/2, h/2+2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// blocky Roblox-style avatar, front faces +z
function makeAvatar(opt={}){
  const suit = opt.suit ?? 0x2e7d5b, skin = opt.skin ?? 0xffd23f, pants = opt.pants ?? suit, arms = opt.arms ?? suit, shoes = opt.shoes ?? 0xffffff;
  const g = new THREE.Group();
  const body = new THREE.Group(); g.add(body);
  const torso = box(1.0,1.1,0.55,suit,0,1.55,0,body);
  if (opt.stripes !== false){ box(0.12,1.1,0.57,0xffffff,0.36,1.55,0,body); box(0.12,1.1,0.57,0xffffff,-0.36,1.55,0,body); }
  const head = box(0.8,0.8,0.8,skin,0,2.5,0,body);
  if (opt.mask){
    box(0.84,0.84,0.84,0x111111,0,2.5,0,body);
    const sym = new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.5), new THREE.MeshBasicMaterial({map:textTexture(opt.mask,'#fff',null,64,64,'bold 50px sans-serif'),transparent:true}));
    sym.position.set(0,2.5,0.43); body.add(sym);
  } else {
    box(0.12,0.16,0.04,0x111111,-0.17,2.58,0.41,body);
    box(0.12,0.16,0.04,0x111111,0.17,2.58,0.41,body);
    box(0.34,0.06,0.04,0x111111,0,2.33,0.41,body);
  }
  if (opt.hair) box(0.86,0.25,0.86,opt.hair,0,2.95,-0.02,body);
  if (opt.bacon){ // Roblox "bacon hair": wavy strips
    box(0.9,0.22,0.9,0x7a3b1f,0,2.98,0,body);
    for (let i=-3;i<=3;i++){ const st = box(0.13,0.55,0.92,i%2?0xb5653a:0x7a3b1f,i*0.13,2.78,-0.02,body); st.rotation.z = (i%2?0.12:-0.12); }
    box(0.9,0.75,0.14,0x7a3b1f,0,2.55,-0.43,body);
    box(0.14,0.6,0.7,0xb5653a,-0.44,2.6,-0.1,body); box(0.14,0.6,0.7,0xb5653a,0.44,2.6,-0.1,body);
  }
  if (opt.cap){ box(0.88,0.28,0.88,opt.cap,0,3.0,0,body); box(0.88,0.07,0.45,opt.cap,0,2.88,0.6,body); box(0.3,0.3,0.05,0xffffff,0,3.02,0.45,body); }
  const mkLimb = (x,y,color,w=0.48) => { const p = new THREE.Group(); p.position.set(x,y,0); body.add(p); box(w,1.0,0.5,color,0,-0.5,0,p); return p; };
  const armL = mkLimb(-0.75,2.1,arms,0.45), armR = mkLimb(0.75,2.1,arms,0.45);
  box(0.45,0.25,0.5,skin,0,-0.9,0,armL); box(0.45,0.25,0.5,skin,0,-0.9,0,armR);
  const legL = mkLimb(-0.26,1.0,pants), legR = mkLimb(0.26,1.0,pants);
  box(0.5,0.18,0.56,shoes,0,-0.92,0.04,legL); box(0.5,0.18,0.56,shoes,0,-0.92,0.04,legR);
  if (opt.num){
    const tag = new THREE.Mesh(new THREE.PlaneGeometry(0.8,0.4), new THREE.MeshBasicMaterial({map:textTexture(opt.num,'#fff',null),transparent:true}));
    tag.position.set(0,1.7,-0.29); tag.rotation.y = Math.PI; body.add(tag);
    const tag2 = new THREE.Mesh(new THREE.PlaneGeometry(0.4,0.2), new THREE.MeshBasicMaterial({map:textTexture(opt.num,'#222','#fff'),transparent:false}));
    tag2.position.set(-0.22,1.85,0.285); body.add(tag2);
  }
  g.userData = {body, armL, armR, legL, legR, phase: Math.random()*10};
  return g;
}
function animateAvatar(a, speed, t, airborne=false){
  const u = a.userData;
  let s = Math.min(speed/7, 1) * 0.9;
  let sw = Math.sin(t*11 + u.phase) * s;
  if (airborne){ u.armL.rotation.x = -2.6; u.armR.rotation.x = -2.6; u.legL.rotation.x = 0.4; u.legR.rotation.x = -0.4; return; }
  u.legL.rotation.x = sw; u.legR.rotation.x = -sw; u.armL.rotation.x = -sw; u.armR.rotation.x = sw;
}

// ---------- audio ----------
let actx = null;
function initAudio(){
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){}
}
function beep(freq, dur=0.15, type='square', vol=0.12, when=0, slideTo=null){
  if (!actx) return;
  const t0 = actx.currentTime + when;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
let noiseBuf = null;
function noise(dur=0.3, vol=0.25, freq=3000, when=0){
  if (!actx) return;
  if (!noiseBuf){ noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; }
  const t0 = actx.currentTime + when;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f).connect(g).connect(actx.destination); s.start(t0); s.stop(t0 + dur + 0.05);
}
const sfx = {
  green(){ beep(660,0.12,'square',0.1,0); beep(880,0.18,'square',0.1,0.15); },
  sing(){ [523,587,659,587,523].forEach((f,i)=>beep(f,0.1,'triangle',0.12,i*0.11)); },
  red(){ beep(220,0.6,'sawtooth',0.12,0); beep(165,0.6,'square',0.06,0); },
  shot(){ noise(0.25,0.35,1200); beep(120,0.15,'square',0.12,0,50); },
  npcShot(){ noise(0.15,0.12,1500); },
  glass(){ noise(0.5,0.35,5000); [2200,3100,2600].forEach((f,i)=>beep(f,0.12,'triangle',0.05,i*0.04)); },
  safe(){ beep(1200,0.1,'sine',0.12); beep(1600,0.15,'sine',0.1,0.08); },
  jump(){ beep(400,0.12,'square',0.05,0,800); },
  win(){ [523,659,784,1046].forEach((f,i)=>beep(f,0.22,'square',0.1,i*0.15)); },
  fall(){ beep(800,0.7,'triangle',0.1,0,120); },
  heal(){ [660,880,1175].forEach((f,i)=>beep(f,0.12,'sine',0.13,i*0.07)); },
  hit(){ beep(180,0.2,'square',0.15,0,90); noise(0.12,0.2,800); },
  check(){ beep(784,0.1,'square',0.08); beep(1046,0.2,'square',0.08,0.1); }
};

// ---------- input ----------
const keys = {};
let jumpQueued = false;
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space'){ jumpQueued = true; e.preventDefault(); }
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const joy = {x:0, y:0, id:null};
let camYaw = 0, camPitch = 0.38, camDist = 10;
const camDrag = {id:null, x:0, y:0};
const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', e => {
  if (camDrag.id !== null) return;
  camDrag.id = e.pointerId; camDrag.x = e.clientX; camDrag.y = e.clientY;
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== camDrag.id) return;
  const k = e.pointerType === 'mouse' ? 0.006 : 0.009;
  camYaw -= (e.clientX - camDrag.x) * k;
  camPitch = Math.max(0.05, Math.min(1.25, camPitch + (e.clientY - camDrag.y) * k * 0.7));
  camDrag.x = e.clientX; camDrag.y = e.clientY;
});
const endDrag = e => { if (e.pointerId === camDrag.id) camDrag.id = null; };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', e => { camDist = Math.max(5, Math.min(18, camDist + e.deltaY*0.01)); e.preventDefault(); }, {passive:false});

const joyEl = $('joy'), knob = $('knob');
function joyUpdate(e){
  const r = joyEl.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
  const max = r.width/2 - 15, len = Math.hypot(dx,dy);
  if (len > max){ dx *= max/len; dy *= max/len; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  joy.x = dx/max; joy.y = -dy/max;
}

// ---------- shared level builders ----------
function addPlatform(L, x, top, z, w, d, color, extra={}){
  const m = box(w, 1, d, color, x, top - 0.5, z, L);
  const s = addSolid(m, extra);
  if (extra.move) dynamics.push({m, base:new THREE.Vector3(x, top - 0.5, z), mv:extra.move, ph:Math.random()*6});
  if (extra.tag === 'check') addFlag(L, x + w/2 - 0.5, top, z - d/2 + 0.5, 0x1ec95a);
  return s;
}
function addDisc(L, x, top, z, r, color, spin=0, extra={}){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 28), mat(color));
  m.position.set(x, top - 0.5, z); m.castShadow = true; m.receiveShadow = true; L.add(m);
  // stripes so spinning is visible
  const st = box(r*1.9, 0.04, 0.35, 0xffffff, 0, 0.51, 0, m); st.castShadow = false;
  const st2 = box(0.35, 0.04, r*1.9, 0xffffff, 0, 0.51, 0, m); st2.castShadow = false;
  const s = addSolid(m, Object.assign({disc:true, r, spin}, extra));
  if (spin) dynamics.push({m, spin});
  return s;
}
function addFlag(L, x, top, z, color){
  box(0.18, 3, 0.18, 0xffffff, x, top + 1.5, z, L);
  box(1.2, 0.8, 0.1, color, x + 0.6, top + 2.6, z, L);
}
// rotating bar obstacle: knocks the player off unless they jump over it
function addSweeper(L, x, top, z, len, w, color=0xe8202a, a0=null){
  const g = new THREE.Group(); g.position.set(x, top, z); L.add(g);
  if (!sweepers.some(o => o.x === x && o.z === z)) addSolid(box(0.6, 1.3, 0.6, 0x444444, x, top + 0.65, z, L), {post:true}); // solid pivot post
  box(len, 0.4, 0.4, color, 0, 0.7, 0, g);
  box(0.42, 0.42, 0.42, 0xffd23f, len/2 - 0.2, 0.7, 0, g); box(0.42, 0.42, 0.42, 0xffd23f, -len/2 + 0.2, 0.7, 0, g);
  const sw = {g, x, z, top, len, w, a: a0 ?? Math.random()*6};
  sweepers.push(sw);
  return sw;
}
function addFinish(L, x, top, z){
  // goal arch + trophy
  box(0.6, 5, 0.6, 0xffffff, x - 3.2, top + 2.5, z + 2, L); box(0.6, 5, 0.6, 0xffffff, x + 3.2, top + 2.5, z + 2, L);

  box(0.3,0.8,0.3,0xffd23f,x-1,top+2.1,z-2,L); box(0.3,0.8,0.3,0xffd23f,x+1,top+2.1,z-2,L);

function buildLevel2(){
  scene.background = new THREE.Color(0x0d1433); scene.fog = new THREE.Fog(0x0d1433, 35, 110);
  hemi.intensity = 1.2; sun.intensity = 1.8; deathY = -14;

  addPlatform(L, 0, 0, 0, 9, 8, 0x3a3f5c);
  box(9, 0.04, 0.6, 0xffd23f, 0, 0.02, -3.7, L);
  const ROWS = 12, SP = 3.5, PS = 2.3, MID = 6, CHK = 6;
  const rowZ = i => -6 - i*SP - (i >= MID ? CHK : 0);
  const midZ = rowZ(MID-1) - PS/2 - 1.15 - 2;   // checkpoint platform centre (depth 4)
  addPlatform(L, 0, 0, midZ, 7, 4, 0x2d6b45, {tag:'check'});
  addPickup(L, -2, 0, midZ);
  const lastZ = rowZ(ROWS-1), endZ = lastZ - PS/2 - 1.3;
  addPlatform(L, 0, 0, endZ - 4, 9, 8, 0x3a3f5c, {tag:'finish'});
  addFinish(L, 0, 0, endZ - 4);
  [-3, 0, 3].forEach(x => box(0.35, 0.35, Math.abs(endZ), 0x8a8f9c, x, -0.35, endZ/2, L));
  box(80, 1, 160, 0x05070f, 0, -40, -30, L);
  for (let i=0;i<9;i++){
    const z = 4 - i*8;
    box(0.8, 30, 0.8, 0x222a44, -12, -14, z, L); box(0.8, 30, 0.8, 0x222a44, 12, -14, z, L);
    const lm = new THREE.MeshBasicMaterial({color: i%2 ? 0xff3b8d : 0x3bd0ff});
    box(1.2, 1.2, 1.2, 0, -12, 1.5, z, L, lm); box(1.2, 1.2, 1.2, 0, 12, 1.5, z, L, lm);
  }
  const glassMat = () => new THREE.MeshPhongMaterial({color:0x9fe8ff, transparent:true, opacity:0.42, shininess:120, specular:0xffffff, emissive:0x10324a});
  for (let i=0;i<ROWS;i++){
    const z = rowZ(i), safeSide = Math.random() < 0.5 ? 0 : 1, row = [];
    for (let s=0;s<2;s++){
      const m = box(PS, 0.2, PS, 0, s===0 ? -1.5 : 1.5, -0.1, z, L, glassMat()); m.castShadow = false;
      box(PS+0.1, 0.06, PS+0.1, 0x666b78, m.position.x, -0.22, z, L).castShadow = false;
      const panel = {mesh:m, safe: s === safeSide, broken:false, revealed:false, row, solid:null};
      panel.solid = addSolid(m, {onLand: () => landPanel(panel)});
      row.push(panel);
    }
  }
  function reveal(p){ if (p.revealed || !p.safe) return; p.revealed = true; p.mesh.material.color.setHex(0x7dffa8); p.mesh.material.emissive.setHex(0x1a6b33); p.mesh.material.opacity = 0.7; }
  function breakPanel(p){
    p.broken = true; p.solid.active = false; p.mesh.visible = false; sfx.glass();
    for (let k=0;k<14;k++){
      const sh = box(0.3+Math.random()*0.5, 0.08, 0.3+Math.random()*0.5, 0, p.mesh.position.x + (Math.random()-0.5)*2, -0.1, p.mesh.position.z + (Math.random()-0.5)*2, L, p.mesh.material);
      sh.castShadow = false;
      shards.push({m:sh, v:new THREE.Vector3((Math.random()-0.5)*3, -Math.random()*3, (Math.random()-0.5)*3), r:new THREE.Vector3(Math.random()*6, Math.random()*6, 0), life:2.5});
    }
    p.row.forEach(o => { if (o !== p) reveal(o); });
  }
  function landPanel(p){
    if (p.broken) return;
    if (p.safe){ if (!p.revealed){ reveal(p); sfx.safe(); } }
    else { breakPanel(p); player.grounded = false; player.ground = null; }
  }
  player.spawn.set(0, 0, 1);
  showMsg('第 2 關：玻璃橋<small>每排兩片玻璃，只有一片是強化玻璃！</small>', 2500, '#9fe8ff');
}

// ---------- healing pickups (♥ heart) ----------
function addPickup(L, x, top, z){
  const g = new THREE.Group(); g.position.set(x, top + 1.3, z); L.add(g);
  const hm = new THREE.MeshLambertMaterial({color:0xff2d55, emissive:0x8a0020});
  if (!addPickup.geo){
    const sh = new THREE.Shape();
    sh.moveTo(5,5); sh.bezierCurveTo(5,5,4,0,0,0); sh.bezierCurveTo(-6,0,-6,7,-6,7); sh.bezierCurveTo(-6,11,-3,15.4,5,19);
    sh.bezierCurveTo(12,15.4,16,11,16,7); sh.bezierCurveTo(16,7,16,0,10,0); sh.bezierCurveTo(7,0,5,5,5,5);
    const geo = new THREE.ExtrudeGeometry(sh, {depth:4, bevelEnabled:true, bevelSize:1.2, bevelThickness:1.2, bevelSegments:2, curveSegments:8});
    geo.center(); geo.rotateZ(Math.PI); geo.scale(0.045, 0.045, 0.045); addPickup.geo = geo;
  }
  const hmesh = new THREE.Mesh(addPickup.geo, hm); hmesh.castShadow = true; g.add(hmesh);
  const glow = new THREE.Mesh(new THREE.CircleGeometry(0.6, 20), new THREE.MeshBasicMaterial({color:0xffd0dc, transparent:true, opacity:0.45}));
  glow.rotation.x = -Math.PI/2; glow.position.set(x, top + 0.03, z); L.add(glow);
  pickups.push({g, glow, x, y: top + 1.3, z, taken:false});
}
function resetPickups(){ for (const p of pickups){ p.taken = false; p.g.visible = true; p.glow.visible = true; } }
function updatePickups(dt, t){
  for (const p of pickups){
    if (p.taken) continue;
    p.g.rotation.y += dt * 2.5; p.g.position.y = p.y + Math.sin(t*3 + p.x) * 0.2;
    if (player.dead || player.hp >= MAXHP) continue;
    if (Math.hypot(player.pos.x - p.x, player.pos.z - p.z) < 1.2 && Math.abs(player.pos.y + 1.2 - p.y) < 1.8){
      p.taken = true; p.g.visible = false; p.glow.visible = false;
      setHP(player.hp + 30); sfx.heal(); flash('#3cff8a'); popText('+30 ❤️', '#5dff8f');
    }
  }
}
// ---------- health ----------
const MAXHP = 100;
function setHP(v){
  player.hp = Math.max(0, Math.min(MAXHP, v));
  const f = $('hpFill'); f.style.width = (player.hp / MAXHP * 100) + '%';
  f.style.background = player.hp > 60 ? '#1ec95a' : player.hp > 30 ? '#ffb020' : '#ff3b3b';
  $('hpNum').textContent = player.hp;
}
function popText(txt, color){
  const e = $('pop'); e.textContent = txt; e.style.color = color; e.classList.remove('show'); void e.offsetWidth; e.classList.add('show');
}
function damage(n){
  if (player.dead || player.invuln > 0 || G.state !== 'playing') return;
  setHP(player.hp - n); player.invuln = 1.2; player.stagger = 0.35; sfx.hit(); popText('-' + n + ' ❤️', '#ff4a4a');
  const f = $('flash'); f.style.background = '#f00'; f.style.transition = 'none'; f.style.opacity = 0.3; requestAnimationFrame(() => { f.style.transition = 'opacity .5s'; f.style.opacity = 0; });
  $('hpWrap').classList.remove('shake'); void $('hpWrap').offsetWidth; $('hpWrap').classList.add('shake');
  if (player.hp <= 0) eliminate('生命歸零！', 'shot', 1.2);
}

function updateDynamics(dt, t){
  for (const dy of dynamics){
    if (dy.spin){ dy.m.rotation.y += dy.spin * dt; continue; }
    const k = Math.sin(t * dy.mv.spd + dy.ph);
    dy.m.position.set(dy.base.x + (dy.mv.ax||0)*k, dy.base.y, dy.base.z + (dy.mv.az||0)*k);
  }
  updatePickups(dt, t);
  for (const sw of sweepers){
    sw.a += sw.w * dt; sw.g.rotation.y = sw.a;
    if (player.dead){ sw.touching = false; continue; }
    const feet = player.pos.y - sw.top;
    if (feet > 0.9 || feet < -2.5){ sw.touching = false; continue; }
    const dx = player.pos.x - sw.x, dz = player.pos.z - sw.z;
    const ca = Math.cos(sw.a), sa = Math.sin(sw.a);
    const along = dx*ca - dz*sa, perp = dx*sa + dz*ca;
    // bar passes through the player and deals damage (no knock-off)
    const touch = Math.abs(along) > 0.45 && Math.abs(along) < sw.len/2 + 0.2 && Math.abs(perp) < 0.2 + R;
    if (touch && !sw.touching) damage(20);   // once per pass: the bar goes through you
    sw.touching = touch;
  }
}

const LEVEL_NAMES = {1:'第 1 關：跳格子踏石', 2:'第 2 關：玻璃橋', 3:'第 3 關：椪糖跳台', 4:'第 4 關：彈珠迴旋', 5:'第 5 關：魷魚決戰（最終關）'};
function loadLevel(n){
  clearLevel();
  G.level = n; $('lvName').textContent = LEVEL_NAMES[n];
  [buildLevel1, buildLevel2, buildLevel3, buildLevel4, buildLevel5][n-1]();
  levelGroup.traverse(o => { if (o.isMesh && o.material && o.material.transparent) o.castShadow = false; });
  player.checkpoint = null;
  respawn();
  G.state = 'playing';
}
window.__game.loadLevel = loadLevel; window.__game.player = player; window.__game.solids = () => solids; window.__game.dynamics = () => dynamics; window.__game.chars = CHARS; window.__game.pickups = () => pickups; window.__game.damage = damage; window.__game.sweepers = () => sweepers;

function startGame(level=1){
  initAudio();
  G.deaths = 0; $('deaths').textContent = '0'; G.runStart = performance.now();
  $('startScreen').classList.add('hidden'); $('winScreen').classList.add('hidden'); $('charScreen').classList.add('hidden'); stamina = 1;
  $('hudL').classList.remove('hidden'); $('restartTop').classList.remove('hidden');
  loadLevel(level);
}
let previews = null;
function makePreviews(){
  const out = {};
  try {
    const r = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
    r.setSize(240, 280); r.setPixelRatio(1);
    const sc = new THREE.Scene(); sc.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 2.2));
    const dl = new THREE.DirectionalLight(0xffffff, 2); dl.position.set(3, 5, 4); sc.add(dl);
    const cam = new THREE.PerspectiveCamera(35, 240/280, 0.1, 50); cam.position.set(0, 2.1, 6.2); cam.lookAt(0, 1.55, 0);
    for (const k in CHARS){ const a = makeAvatar(CHARS[k].look); a.rotation.y = 0.45; a.userData.armR.rotation.x = -0.5; a.userData.legL.rotation.x = 0.3; a.userData.legR.rotation.x = -0.3;
      sc.add(a); r.render(sc, cam); out[k] = r.domElement.toDataURL('image/png'); sc.remove(a); }
    r.dispose(); r.forceContextLoss && r.forceContextLoss();
  } catch(e){ }
  return out;
}
function stars(n){ return `<span class="bar"><i style="width:${n*20}%"></i></span>`; }
function showCharSelect(){
  G.state = 'menu';
  if (!previews) previews = makePreviews();
  const c = $('cards'); c.innerHTML = '';
  for (const k in CHARS){
    const ch = CHARS[k], d = document.createElement('div'); d.className = 'card'; d.dataset.char = k;
    d.innerHTML = `${previews[k] ? `<img src="${previews[k]}" alt="${ch.name}">` : ''}<h2>${ch.name}</h2>
      <div class="row">速度${stars(ch.spd)}</div><div class="row">跳躍${stars(ch.jmp)}</div>
      <div class="ab">${ch.ab}</div><span class="tag" style="background:${ch.tagC}">${ch.tag}</span>`;
    d.addEventListener('click', () => { setCharacter(k); $('charScreen').classList.add('hidden'); startGame(1); });
    c.appendChild(d);
  }
  ['startScreen','winScreen'].forEach(id => $(id).classList.add('hidden'));
  $('hudL').classList.add('hidden'); $('restartTop').classList.add('hidden');
  $('charScreen').classList.remove('hidden');
}
window.__game.showCharSelect = showCharSelect;
$('startBtn').addEventListener('click', () => { initAudio(); showCharSelect(); });
$('againBtn').addEventListener('click', () => showCharSelect());
$('restartTop').addEventListener('click', () => { if (confirm('確定要重新開始並重新選擇角色嗎？')) showCharSelect(); });

// ---------- physics ----------
const GRAV = 28;
const tmpF = new THREE.Vector3(), tmpR = new THREE.Vector3();
function updatePlayer(dt, t){
  const u = playerAvatar.userData;
  if (player.dead){
    player.deadT -= dt;
    player.vel.y -= GRAV*dt; player.pos.addScaledVector(player.vel, dt); playerAvatar.position.copy(player.pos);
    if (player.deadT <= 0) respawn();
    return;
  }
  // carry by moving platform
  if (player.grounded && player.ground){
    const m = player.ground.mesh.position;
    player.pos.x += m.x - player.ground.lastX; player.pos.z += m.z - player.ground.lastZ;
    if (player.ground.spin){ const a = player.ground.spin*dt, dx = player.pos.x - m.x, dz = player.pos.z - m.z, c = Math.cos(a), sn = Math.sin(a);
      player.pos.x = m.x + dx*c + dz*sn; player.pos.z = m.z - dx*sn + dz*c; player.facing += a; }
  }
  let ix = 0, iy = 0;
  if (G.state === 'playing'){
    if (keys.KeyW || keys.ArrowUp) iy += 1; if (keys.KeyS || keys.ArrowDown) iy -= 1;
    if (keys.KeyD || keys.ArrowRight) ix += 1; if (keys.KeyA || keys.ArrowLeft) ix -= 1;
    ix += joy.x; iy += joy.y;
  }
  let il = Math.hypot(ix, iy); if (il > 1){ ix /= il; iy /= il; il = 1; }
  if (il < 0.12){ ix = iy = 0; il = 0; }
  tmpF.set(-Math.sin(camYaw), 0, -Math.cos(camYaw)); tmpR.set(Math.cos(camYaw), 0, -Math.sin(camYaw));
  const sprinting = CH.sprint && (keys.ShiftLeft || keys.ShiftRight || sprintHeld) && stamina > 0 && il > 0;
  if (CH.sprint){ stamina = sprinting ? Math.max(0, stamina - dt/2.5) : Math.min(1, stamina + dt/3); $('stamFill').style.width = (stamina*100).toFixed(0) + '%'; }
  player.invuln -= dt; if (player.stagger > 0) player.stagger -= dt;
  playerAvatar.visible = player.invuln > 0 ? (Math.floor(player.invuln * 10) % 2 === 0) : true;
  const MOVE = CH.move * (sprinting ? CH.sprint : 1) * (player.stagger > 0 ? 0.45 : 1);
  const tx = (tmpF.x*iy + tmpR.x*ix) * MOVE, tz = (tmpF.z*iy + tmpR.z*ix) * MOVE;
  player.knock -= dt;
  const acc = Math.min(1, dt * (player.knock > 0 ? 0.8 : player.grounded ? 14 : 5));
  player.vel.x += (tx - player.vel.x) * acc; player.vel.z += (tz - player.vel.z) * acc;
  if (player.grounded) player.coyote = 0.1; else player.coyote -= dt;
  if (player.grounded) player.dbl = false;
  if (jumpQueued && G.state === 'playing'){
    if (player.coyote > 0){ player.vel.y = CH.jump; player.grounded = false; player.ground = null; player.coyote = 0; sfx.jump(); }
    else if (CH.dbl && !player.dbl){ player.dbl = true; player.vel.y = CH.jump * 0.9; player.flip = 0.45; sfx.jump(); beep(900,0.1,'square',0.05,0.05,1400); }
  }
  if (player.flip > 0){ player.flip -= dt; playerAvatar.userData.body.rotation.x = -(1 - player.flip/0.45) * Math.PI * 2; if (player.flip <= 0) playerAvatar.userData.body.rotation.x = 0; }
  jumpQueued = false;
  player.vel.y -= GRAV * dt; if (player.vel.y < -40) player.vel.y = -40;
  const prevY = player.pos.y;
  player.pos.x += player.vel.x * dt; player.pos.z += player.vel.z * dt; player.pos.y += player.vel.y * dt;
  // collisions
  player.grounded = false; let newGround = null;
  for (const s of solids){
    if (!s.active) continue;
    const b = solidBounds(s);
    const ddx = player.pos.x - s.mesh.position.x, ddz = player.pos.z - s.mesh.position.z, dd = Math.hypot(ddx, ddz);
    const inXZ = s.disc ? dd < s.r + R*0.6 : (player.pos.x > b.minx - R*0.6 && player.pos.x < b.maxx + R*0.6 && player.pos.z > b.minz - R*0.6 && player.pos.z < b.maxz + R*0.6);
    if (inXZ && player.vel.y <= 0 && prevY >= b.top - 0.25 && player.pos.y <= b.top + 0.02){
      player.pos.y = b.top; player.vel.y = 0; player.grounded = true; newGround = s;
    } else if (s.disc){
      if (player.pos.y < b.top - 0.25 && player.pos.y + 2.8 > b.bottom && dd < s.r + R && dd > 1e-4){ const k = (s.r + R)/dd; player.pos.x = s.mesh.position.x + ddx*k; player.pos.z = s.mesh.position.z + ddz*k; }
    } else if (player.pos.y < b.top - 0.25 && player.pos.y + 2.8 > b.bottom){
      // side push
      const ox1 = (b.maxx + R) - player.pos.x, ox2 = player.pos.x - (b.minx - R);
      const oz1 = (b.maxz + R) - player.pos.z, oz2 = player.pos.z - (b.minz - R);
      if (ox1 > 0 && ox2 > 0 && oz1 > 0 && oz2 > 0){
        const mn = Math.min(ox1, ox2, oz1, oz2);
        if (mn === ox1) player.pos.x += ox1; else if (mn === ox2) player.pos.x -= ox2; else if (mn === oz1) player.pos.z += oz1; else player.pos.z -= oz2;
      }
    }
  }
  const landed = newGround && newGround !== player.ground;
  player.ground = newGround;
  if (landed && newGround.onLand) newGround.onLand();
  if (landed && newGround.tag === 'check' && player.checkpoint !== newGround){
    player.checkpoint = newGround; const b = solidBounds(newGround); player.spawn.set((b.minx+b.maxx)/2, b.top, (b.minz+b.maxz)/2);
    sfx.check(); showMsg('🚩 檢查點！', 1200, '#5dff8f');
  }
  if (player.grounded && newGround && newGround.tag === 'finish') completeLevel();
  if (!player.dead && player.pos.y < deathY) eliminate('掉下去了！', 'fall', 0.9);
  // avatar
  const hs = Math.hypot(player.vel.x, player.vel.z);
  if (hs > 0.5){ const target = Math.atan2(player.vel.x, player.vel.z); let d = target - player.facing; d = Math.atan2(Math.sin(d), Math.cos(d)); player.facing += d * Math.min(1, dt*12); }
  playerAvatar.position.copy(player.pos); playerAvatar.rotation.y = player.facing;
  animateAvatar(playerAvatar, hs, t, !player.grounded && Math.abs(player.vel.y) > 2);
}
function storeLast(){ for (const s of solids){ const p = s.mesh.position; s.lastX = p.x; s.lastY = p.y; s.lastZ = p.z; } }

// ---------- main loop ----------
let last = performance.now(), menuT = 0;
const camTarget = new THREE.Vector3();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  const t = now/1000;
  if (G.state === 'playing' || G.state === 'transition'){
    updateDynamics(dt, t);
    if (levelUpdate) levelUpdate(dt, t);
    updatePlayer(dt, t);
    storeLast();
    for (let i = shards.length-1; i >= 0; i--){ const s = shards[i]; s.v.y -= GRAV*0.6*dt; s.m.position.addScaledVector(s.v, dt); s.m.rotation.x += s.r.x*dt; s.m.rotation.y += s.r.y*dt; s.life -= dt; if (s.life <= 0){ s.m.parent && s.m.parent.remove(s.m); shards.splice(i,1); } }
    if (G.state === 'playing') $('time').textContent = ((performance.now() - G.runStart)/1000).toFixed(1);
  } else if (G.state === 'menu' && !levelGroup){
    loadLevel(1); G.state = 'menu';
  } else if (G.state === 'menu'){
    menuT += dt; camYaw = Math.sin(menuT*0.2)*0.6; updateDynamics(dt, t);
  }
  camTarget.set(player.pos.x, Math.max(player.pos.y, deathY + 4) + 2.2, player.pos.z);
  const cp = Math.cos(camPitch);
  camera.position.set(camTarget.x + Math.sin(camYaw)*cp*camDist, camTarget.y + Math.sin(camPitch)*camDist, camTarget.z + Math.cos(camYaw)*cp*camDist);
  camera.lookAt(camTarget);
  sun.position.set(player.pos.x + 15, player.pos.y + 35, player.pos.z + 12); sun.target.position.copy(player.pos);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

// test hook: ?level=N starts directly at that level
if (params.has('level')) setTimeout(() => startGame(Math.max(1, Math.min(5, +params.get('level') || 1))), 50);
})();
</script>
