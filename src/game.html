    const dx = player.pos.x - sw.x, dz = player.pos.z - sw.z;

  if (CH.sprint){ stamina = sprinting ? Math.max(0, stamina - dt/2.5) : Math.min(1, stamina + dt/3); $('stamFill').style.width = (stamina*100).toFixed(0) + '%'; }

  const MOVE = CH.move * (sprinting ? CH.sprint : 1) * (player.stagger > 0 ? 0.45 : 1);

  $('packs').innerHTML = Object.keys(PACKS).map(id => {
    const owned = unlockedPacks.has(id), soon = isPlaceholder(P[id].checkoutUrl);
    const imgs = PACKS[id].skins.map(s => shopThumbs[s] ? `<img src="${shopThumbs[s]}" alt="">` : '').join('');
    const btn = owned ? `<button class="btn small owned" disabled>${tr('owned')}</button>`
      : soon ? `<button class="btn small soon" disabled>${tr('soon')}</button>`
      : `<button class="btn small buy" data-buy="${id}">${tr('buy')} ${P[id].price}</button>`;
    return `<div class="pack ${id === 'supporter' ? 'sup' : ''}" data-pack="${id}"><div class="pimgs">${imgs}</div><h3>${tr('packs')[id]}</h3>
      <div class="pdesc">${tr('packDesc')[id]}</div><div class="price">${P[id].price}</div>${btn}</div>`;
  }).join('');
  $('skinsRow').innerHTML = Object.keys(SKINS).map(k => {
    const ok = skinUnlocked(k), on = k === equippedSkin;
    return `<div class="skin ${ok ? '' : 'lockedSkin'} ${on ? 'on' : ''}" data-skin="${k}">${shopThumbs[k] ? `<img src="${shopThumbs[k]}" alt="">` : ''}
      <div class="sname">${tr('skins')[k]}</div><div class="sbtn">${on ? tr('equipped') : ok ? tr('equip') : tr('locked')}</div></div>`;
  }).join('');
  $('packs').querySelectorAll('[data-buy]').forEach(b => b.addEventListener('click', () => {
    const url = P[b.dataset.buy].checkoutUrl; if (!isPlaceholder(url)) window.open(url, '_blank', 'noopener');
  }));
  $('skinsRow').querySelectorAll('.skin').forEach(e => e.addEventListener('click', () => {
    const k = e.dataset.skin; if (!skinUnlocked(k)) return;
    equippedSkin = k; store.set('skin', k); setCharacter(charKey); renderShop();
  }));
}
function licStatus(msg, ok){ const e = $('licStatus'); e.textContent = msg; e.style.color = ok === true ? '#5dff8f' : ok === false ? '#ff8a8a' : '#fff'; }
function packsForMeta(meta){
  const P = CONFIG.lemonSqueezy.packs, found = new Set();
  for (const id in P){
    const p = P[id];
    if ((p.productIds || []).map(Number).includes(Number(meta.product_id)) || (p.variantIds || []).map(Number).includes(Number(meta.variant_id))){
      found.add(id); (PACKS[id].includes || []).forEach(x => found.add(x));
    }
  }
  return [...found];
}
async function redeemLicense(raw){
  const key = (raw || '').trim();
  if (!key) return;
  const lic = store.get('licenses', []);
  if (lic.some(l => l.key === key)){ licStatus(tr('licDup'), false); return; }
  licStatus(tr('checking'));
  let j;
  try {
    const body = new URLSearchParams({license_key: key, instance_name: 'Candy Cloud Dash ' + deviceId()});
    const r = await fetch(LS_API + '/activate', {method:'POST', headers:{Accept:'application/json'}, body});
    j = await r.json();
  } catch(e){ licStatus(tr('licNet'), false); return; }
  if (!j || !j.activated){
    const err = (j && j.error) || '';
    licStatus(/limit/i.test(err) ? tr('licLimit') : tr('licBad'), false); return;
  }
  const meta = j.meta || {}, st = j.license_key && j.license_key.status;
  if (st && !['active', 'inactive'].includes(st)){ licStatus(tr('licInactive'), false); return; }
  const sid = CONFIG.lemonSqueezy.storeId;
  if (sid && Number(meta.store_id) !== Number(sid)){ licStatus(tr('licWrong'), false); return; }
  const packs = packsForMeta(meta);
  if (!packs.length){ licStatus(tr('licWrong'), false); return; }
  packs.forEach(p => unlockedPacks.add(p)); store.set('unlocked', [...unlockedPacks]);
  lic.push({key, instanceId: j.instance && j.instance.id, packs, product: meta.product_name, at: Date.now()}); store.set('licenses', lic);
  const first = PACKS[packs.includes('supporter') ? 'supporter' : packs[0]].skins[0];
  equippedSkin = first; store.set('skin', first); setCharacter(charKey);
  sfx.win && initAudio(); sfx.win();
  licStatus(tr('licOk', packs.map(p => tr('packs')[p]).join(', ')), true); $('licInput').value = '';
  renderShop(); updateBadge();
}
function updateBadge(){ $('supBadge').classList.toggle('hidden', PORTAL || !isSupporter()); }
// drag-to-scroll for the shop (page-level touch scrolling is disabled for gameplay)
(function(){
  const el = $('shopScreen'); let id = null, y0 = 0, s0 = 0, moved = false;
  el.addEventListener('pointerdown', e => { if (e.target.closest('input')) return; id = e.pointerId; y0 = e.clientY; s0 = el.scrollTop; moved = false; });
  el.addEventListener('pointermove', e => { if (e.pointerId !== id) return; const dy = e.clientY - y0; if (Math.abs(dy) > 6) moved = true; el.scrollTop = s0 - dy; });
  const end = e => { if (e.pointerId === id) id = null; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('click', e => { if (moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
})();
$('licBtn').addEventListener('click', () => redeemLicense($('licInput').value));
$('licInput').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') redeemLicense($('licInput').value); });
$('licInput').addEventListener('keyup', e => e.stopPropagation());
$('shopBack').addEventListener('click', closeShop);
$('shopBtn').addEventListener('click', () => showShop('start'));
$('shopBtnWin').addEventListener('click', () => showShop('win'));
// ---------- share (Web Share API → clipboard fallback) ----------
async function shareResult(){
  const tm = lastWin ? tr('timeFmt', lastWin[0], lastWin[1]) : '';
  const url = PORTAL ? (document.referrer || location.href) : CONFIG.gameUrl;
  const text = tr('shareText', tm);
  try { if (navigator.share){ await navigator.share({title: 'Candy Cloud Dash', text, url}); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
  const full = text + ' ' + url;
  try { await navigator.clipboard.writeText(full); popText(tr('copied'), '#5dff8f'); return; } catch(e){}
  window.prompt(tr('copied'), full);
}
$('shareBtn').addEventListener('click', shareResult);
window.__game.shop = {showShop, redeemLicense, config: CONFIG, unlocked: () => [...unlockedPacks], skin: () => equippedSkin, portal: PORTAL, shareResult};
if (PORTAL) document.querySelectorAll('.shopOnly').forEach(e => e.classList.add('hidden'));
updateBadge();

$('langBtn').addEventListener('click', () => setLang(LANG === 'en' ? 'zh' : 'en'));
applyLang();
// test hook: ?level=N starts directly at that level
if (params.has('level')) setTimeout(() => startGame(Math.max(1, Math.min(5, +params.get('level') || 1))), 50);
})();
</script>
