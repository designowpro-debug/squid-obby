<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e8336d">
<link rel="icon" href="data:,">
<title>魷魚遊戲 闖關挑戰 (Squid Obby)</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#111;position:fixed;inset:0;
    overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;font-family:"PingFang TC","Heiti TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;}
  #app,canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  .hud{position:fixed;z-index:5;pointer-events:none;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;}
  #hudL{top:calc(10px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));font-size:16px;line-height:1.5;
    background:rgba(0,0,0,.35);padding:8px 12px;border-radius:12px;font-weight:700}
  #hudL .lv{font-size:18px;color:#ffd23f}
  #light{top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:30px;font-weight:900;
    padding:6px 26px;border-radius:40px;display:none;border:4px solid #fff}
  #light.green{background:#1ec95a;display:block}
  #light.red{background:#e8202a;display:block}
  #light.turn{background:#f2a516;display:block}
  #cd{top:calc(66px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:24px;font-weight:900;display:none}
  #msg{top:38%;left:50%;transform:translate(-50%,-50%);font-size:min(12vw,72px);font-weight:900;text-align:center;
    display:none;white-space:nowrap;letter-spacing:4px}
  #msg small{display:block;font-size:22px;letter-spacing:1px}
  #flash{position:fixed;inset:0;background:#f00;opacity:0;pointer-events:none;z-index:4;transition:opacity .4s}
  .screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%,rgba(232,51,109,.92),rgba(40,10,30,.96));color:#fff;text-align:center;padding:20px;box-sizing:border-box}
  .screen h1{font-size:min(11vw,64px);margin:0 0 6px;text-shadow:0 5px 0 #000;letter-spacing:3px}
  .screen .shapes{font-size:min(10vw,54px);letter-spacing:18px;margin-bottom:6px}
  .screen p{margin:4px 0;font-size:17px;max-width:620px;line-height:1.55}
  .btn{pointer-events:auto;margin-top:18px;font-size:28px;font-weight:900;padding:14px 46px;border-radius:18px;border:4px solid #fff;
    background:#1ec95a;color:#fff;box-shadow:0 6px 0 #0a6b2c;cursor:pointer;font-family:inherit;touch-action:manipulation}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0a6b2c}
  .hidden{display:none!important}
  #touch{position:fixed;inset:0;z-index:6;pointer-events:none;display:none}
  #touch.on{display:block}
  #joy{position:absolute;left:calc(28px + env(safe-area-inset-left));bottom:calc(28px + env(safe-area-inset-bottom));width:160px;height:160px;
    border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:rgba(255,255,255,.75);
    box-shadow:0 3px 8px rgba(0,0,0,.4)}
  #jumpBtn{position:absolute;right:calc(34px + env(safe-area-inset-right));bottom:calc(40px + env(safe-area-inset-bottom));width:110px;height:110px;
    border-radius:50%;background:rgba(30,201,90,.75);border:4px solid #fff;color:#fff;font-size:32px;font-weight:900;display:flex;
    align-items:center;justify-content:center;pointer-events:auto;touch-action:none;text-shadow:0 2px 0 #000}
  #jumpBtn.pressed{background:rgba(20,150,60,.95);transform:scale(.94)}
  #camHint{position:absolute;right:calc(30px + env(safe-area-inset-right));bottom:calc(165px + env(safe-area-inset-bottom));color:#fff;opacity:.7;font-size:14px;text-shadow:0 1px 2px #000}
  #restartTop{position:fixed;z-index:7;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));font-size:15px;
    padding:8px 12px;border-radius:12px;border:2px solid #fff;background:rgba(0,0,0,.4);color:#fff;font-family:inherit;font-weight:700;touch-action:manipulation}
</style>
</head>
<body>
<div id="app"></div>
<div id="flash"></div>
<div id="hudL" class="hud hidden"><div class="lv" id="lvName">第 1 關</div><div>💀 淘汰次數：<span id="deaths">0</span></div><div>⏱ 總時間：<span id="time">0.0</span> 秒</div></div>
<div id="msg" class="hud"></div>
<button id="restartTop" class="hidden">↻ 重新開始</button>
<div id="touch"><div id="joy"><div id="knob"></div></div><div id="camHint">拖曳畫面轉視角</div><div id="jumpBtn">跳</div></div>

<div id="startScreen" class="screen">
  <div class="shapes">○△□</div>
  <h1>魷魚遊戲 闖關挑戰</h1>
  <p>三道跳躍關卡：<b>跳格子踏石</b> → <b>玻璃橋</b> → <b>椪糖跳台</b>，活著抵達終點！掉下去會回到檢查點 🚩</p>
  <p>⌨️ 電腦：WASD／方向鍵移動、空白鍵跳躍、滑鼠拖曳轉動視角</p>
  <p>📱 平板／手機：左下搖桿移動、右下「跳」按鈕、拖曳畫面轉動視角</p>
  <button class="btn" id="startBtn">開始遊戲</button>
</div>
<div id="winScreen" class="screen hidden">
  <div class="shapes">🏆</div>
  <h1>恭喜通關！</h1>
  <p style="font-size:24px">總時間：<b id="winTime">0</b></p>
  <p style="font-size:24px">淘汰次數：<b id="winDeaths">0</b></p>
  <button class="btn" id="againBtn">再玩一次</button>
</div>

<script>/*THREE_JS*/</script>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || params.has('touch');

// ---------- prevent page scroll / zoom (iPad Safari) ----------
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));
document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouchEnd < 300 && e.target.tagName !== 'BUTTON') e.preventDefault(); lastTouchEnd = n; }, {passive:false});
document.addEventListener('contextmenu', e => e.preventDefault());

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({antialias: !isTouch || devicePixelRatio < 2, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
$('app').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 500);
const hemi = new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
const sc = sun.shadow.camera; sc.left = -30; sc.right = 30; sc.top = 30; sc.bottom = -30; sc.near = 1; sc.far = 120;
sun.shadow.bias = -0.0008;
scene.add(sun); scene.add(sun.target);

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < h ? 75 : 60;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

// ---------- helpers ----------
const unitBox = new THREE.BoxGeometry(1,1,1);
const R = 0.45;
const matCache = {};
function mat(color){ if(!matCache[color]) matCache[color] = new THREE.MeshLambertMaterial({color}); return matCache[color]; }
function box(w,h,d,color,x=0,y=0,z=0,parent=null,material=null){
  const m = new THREE.Mesh(unitBox, material || mat(color));
  m.scale.set(w,h,d); m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
function textTexture(text, fg='#fff', bg=null, w=128, h=64, font='bold 44px sans-serif'){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  if (bg){ g.fillStyle = bg; g.fillRect(0,0,w,h); }
  g.fillStyle = fg; g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, w/2, h/2+2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// blocky Roblox-style avatar, front faces +z
function makeAvatar(opt={}){
  const suit = opt.suit ?? 0x2e7d5b, skin = opt.skin ?? 0xffd23f, pants = opt.pants ?? suit;
  const g = new THREE.Group();
  const body = new THREE.Group(); g.add(body);
  const torso = box(1.0,1.1,0.55,suit,0,1.55,0,body);
  box(0.12,1.1,0.57,0xffffff,0.36,1.55,0,body); // stripe
  box(0.12,1.1,0.57,0xffffff,-0.36,1.55,0,body);
  const head = box(0.8,0.8,0.8,skin,0,2.5,0,body);
  if (opt.mask){
    box(0.84,0.84,0.84,0x111111,0,2.5,0,body);
    const sym = new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.5), new THREE.MeshBasicMaterial({map:textTexture(opt.mask,'#fff',null,64,64,'bold 50px sans-serif'),transparent:true}));
    sym.position.set(0,2.5,0.43); body.add(sym);
  } else {
    box(0.12,0.16,0.04,0x111111,-0.17,2.58,0.41,body);
    box(0.12,0.16,0.04,0x111111,0.17,2.58,0.41,body);
    box(0.34,0.06,0.04,0x111111,0,2.33,0.41,body);
  }
  if (opt.hair) box(0.86,0.25,0.86,opt.hair,0,2.95,-0.02,body);
  const mkLimb = (x,y,color,w=0.48) => { const p = new THREE.Group(); p.position.set(x,y,0); body.add(p); box(w,1.0,0.5,color,0,-0.5,0,p); return p; };
  const armL = mkLimb(-0.75,2.1,suit,0.45), armR = mkLimb(0.75,2.1,suit,0.45);
  box(0.45,0.25,0.5,skin,0,-0.9,0,armL); box(0.45,0.25,0.5,skin,0,-0.9,0,armR);
  const legL = mkLimb(-0.26,1.0,pants), legR = mkLimb(0.26,1.0,pants);
  box(0.5,0.18,0.56,0xffffff,0,-0.92,0.04,legL); box(0.5,0.18,0.56,0xffffff,0,-0.92,0.04,legR);
  if (opt.num){
    const tag = new THREE.Mesh(new THREE.PlaneGeometry(0.8,0.4), new THREE.MeshBasicMaterial({map:textTexture(opt.num,'#fff',null),transparent:true}));
    tag.position.set(0,1.7,-0.29); tag.rotation.y = Math.PI; body.add(tag);
    const tag2 = new THREE.Mesh(new THREE.PlaneGeometry(0.4,0.2), new THREE.MeshBasicMaterial({map:textTexture(opt.num,'#222','#fff'),transparent:false}));
    tag2.position.set(-0.22,1.85,0.285); body.add(tag2);
  }
  g.userData = {body, armL, armR, legL, legR, phase: Math.random()*10};
  return g;
}
function animateAvatar(a, speed, t, airborne=false){
  const u = a.userData;
  let s = Math.min(speed/7, 1) * 0.9;
  let sw = Math.sin(t*11 + u.phase) * s;
  if (airborne){ u.armL.rotation.x = -2.6; u.armR.rotation.x = -2.6; u.legL.rotation.x = 0.4; u.legR.rotation.x = -0.4; return; }
  u.legL.rotation.x = sw; u.legR.rotation.x = -sw; u.armL.rotation.x = -sw; u.armR.rotation.x = sw;
}

// ---------- audio ----------
let actx = null;
function initAudio(){
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){}
}
function beep(freq, dur=0.15, type='square', vol=0.12, when=0, slideTo=null){
  if (!actx) return;
  const t0 = actx.currentTime + when;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
let noiseBuf = null;
function noise(dur=0.3, vol=0.25, freq=3000, when=0){
  if (!actx) return;
  if (!noiseBuf){ noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; }
  const t0 = actx.currentTime + when;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f).connect(g).connect(actx.destination); s.start(t0); s.stop(t0 + dur + 0.05);
}
const sfx = {
  green(){ beep(660,0.12,'square',0.1,0); beep(880,0.18,'square',0.1,0.15); },
  sing(){ [523,587,659,587,523].forEach((f,i)=>beep(f,0.1,'triangle',0.12,i*0.11)); },
  red(){ beep(220,0.6,'sawtooth',0.12,0); beep(165,0.6,'square',0.06,0); },
  shot(){ noise(0.25,0.35,1200); beep(120,0.15,'square',0.12,0,50); },
  npcShot(){ noise(0.15,0.12,1500); },
  glass(){ noise(0.5,0.35,5000); [2200,3100,2600].forEach((f,i)=>beep(f,0.12,'triangle',0.05,i*0.04)); },
  safe(){ beep(1200,0.1,'sine',0.12); beep(1600,0.15,'sine',0.1,0.08); },
  jump(){ beep(400,0.12,'square',0.05,0,800); },
  win(){ [523,659,784,1046].forEach((f,i)=>beep(f,0.22,'square',0.1,i*0.15)); },
  fall(){ beep(800,0.7,'triangle',0.1,0,120); },
  hit(){ beep(180,0.2,'square',0.15,0,90); noise(0.12,0.2,800); },
  check(){ beep(784,0.1,'square',0.08); beep(1046,0.2,'square',0.08,0.1); }
};

// ---------- input ----------
const keys = {};
let jumpQueued = false;
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space'){ jumpQueued = true; e.preventDefault(); }
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const joy = {x:0, y:0, id:null};
let camYaw = 0, camPitch = 0.38, camDist = 10;
const camDrag = {id:null, x:0, y:0};
const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', e => {
  if (camDrag.id !== null) return;
  camDrag.id = e.pointerId; camDrag.x = e.clientX; camDrag.y = e.clientY;
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== camDrag.id) return;
  const k = e.pointerType === 'mouse' ? 0.006 : 0.009;
  camYaw -= (e.clientX - camDrag.x) * k;
  camPitch = Math.max(0.05, Math.min(1.25, camPitch + (e.clientY - camDrag.y) * k * 0.7));
  camDrag.x = e.clientX; camDrag.y = e.clientY;
});
const endDrag = e => { if (e.pointerId === camDrag.id) camDrag.id = null; };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', e => { camDist = Math.max(5, Math.min(18, camDist + e.deltaY*0.01)); e.preventDefault(); }, {passive:false});

const joyEl = $('joy'), knob = $('knob');
function joyUpdate(e){
  const r = joyEl.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
  const max = r.width/2 - 15, len = Math.hypot(dx,dy);
  if (len > max){ dx *= max/len; dy *= max/len; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  joy.x = dx/max; joy.y = -dy/max;
}
joyEl.addEventListener('pointerdown', e => { joy.id = e.pointerId; try{joyEl.setPointerCapture(e.pointerId);}catch(_){} joyUpdate(e); e.preventDefault(); });
joyEl.addEventListener('pointermove', e => { if (e.pointerId === joy.id) joyUpdate(e); });
const joyEnd = e => { if (e.pointerId === joy.id){ joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; } };
joyEl.addEventListener('pointerup', joyEnd); joyEl.addEventListener('pointercancel', joyEnd);
const jb = $('jumpBtn');
jb.addEventListener('pointerdown', e => { jumpQueued = true; jb.classList.add('pressed'); e.preventDefault(); });
const jbUp = () => jb.classList.remove('pressed');
jb.addEventListener('pointerup', jbUp); jb.addEventListener('pointercancel', jbUp); jb.addEventListener('pointerleave', jbUp);
if (isTouch) $('touch').classList.add('on');

// ---------- game state ----------
const G = { state:'menu', level:0, deaths:0, runStart:0, totalTime:0 };
window.__game = G;
let levelGroup = null, solids = [], dynamics = [], shards = [], sweepers = [];
let levelUpdate = null, onRespawn = null;
const player = { pos:new THREE.Vector3(), vel:new THREE.Vector3(), grounded:false, ground:null, dead:false, deadT:0, spawn:new THREE.Vector3(), facing:Math.PI, coyote:0, knock:0, checkpoint:null };
const playerAvatar = makeAvatar({suit:0x16a8a0, skin:0xffd23f, pants:0x16a8a0, num:'456', hair:0x3b2a1a});
scene.add(playerAvatar);
playerAvatar.traverse(o => { if (o.isMesh) o.castShadow = true; });
let deathY = -15;

function addSolid(mesh, extra={}){
  const s = Object.assign({mesh, active:true, lastX:mesh.position.x, lastY:mesh.position.y, lastZ:mesh.position.z}, extra);
  solids.push(s); return s;
}
function solidBounds(s){
  const m = s.mesh, p = m.position, sc = m.scale;
  const hw = (s.hw ?? sc.x/2), hd = (s.hd ?? sc.z/2), hh = (s.hh ?? sc.y/2);
  return {minx:p.x-hw, maxx:p.x+hw, minz:p.z-hd, maxz:p.z+hd, top:p.y+hh, bottom:p.y-hh};
}

function clearLevel(){
  if (levelGroup){ scene.remove(levelGroup); levelGroup.traverse(o => { if (o.geometry && o.geometry !== unitBox) o.geometry.dispose(); }); }
  levelGroup = new THREE.Group(); scene.add(levelGroup);
  solids = []; dynamics = []; shards = []; sweepers = []; levelUpdate = null; onRespawn = null;
}
function showMsg(html, ms=1500, color='#fff'){
  const m = $('msg'); m.innerHTML = html; m.style.color = color; m.style.display = 'block';
  clearTimeout(showMsg.t); if (ms > 0) showMsg.t = setTimeout(() => m.style.display = 'none', ms);
}
function flash(color='#f00'){ const f = $('flash'); f.style.background = color; f.style.transition = 'none'; f.style.opacity = 0.55; requestAnimationFrame(() => { f.style.transition = 'opacity .6s'; f.style.opacity = 0; }); }

function respawn(){
  player.pos.copy(player.spawn); player.vel.set(0,0,0); player.dead = false; player.grounded = false; player.ground = null; player.knock = 0;
  player.facing = Math.PI; camYaw = 0;
  playerAvatar.rotation.set(0, Math.PI, 0); playerAvatar.userData.body.rotation.set(0,0,0); playerAvatar.userData.body.position.set(0,0,0);
  if (onRespawn) onRespawn();
}
function eliminate(text='淘汰！', sound='shot', delay=1.4){
  if (player.dead || G.state !== 'playing') return;
  player.dead = true; player.deadT = delay; G.deaths++; $('deaths').textContent = G.deaths;
  sfx[sound] && sfx[sound](); flash();
  showMsg(text + '<small>回到檢查點重新挑戰</small>', delay*1000, '#ff4a4a');
}
function completeLevel(){
  if (G.state !== 'playing') return;
  G.state = 'transition'; sfx.win();
  if (G.level >= 3){
    G.totalTime = (performance.now() - G.runStart)/1000;
    showMsg('🏆 通關！', 1800, '#ffd23f');
    setTimeout(showWin, 1800);
  } else {
    showMsg(`第 ${G.level} 關 過關！<small>準備進入下一關…</small>`, 2200, '#5dff8f');
    setTimeout(() => loadLevel(G.level + 1), 2300);
  }
}
function showWin(){
  G.state = 'win';
  const t = G.totalTime, mm = Math.floor(t/60), ss = (t%60).toFixed(1);
  $('winTime').textContent = `${mm} 分 ${ss} 秒`; $('winDeaths').textContent = G.deaths;
  $('winScreen').classList.remove('hidden'); $('restartTop').classList.add('hidden');
}

// ---------- shared level builders ----------
function addPlatform(L, x, top, z, w, d, color, extra={}){
  const m = box(w, 1, d, color, x, top - 0.5, z, L);
  const s = addSolid(m, extra);

  for (let i=0;i<ROWS;i++){

function updateDynamics(dt, t){
  for (const dy of dynamics){
    if (dy.spin){ dy.m.rotation.y += dy.spin * dt; continue; }
    const k = Math.sin(t * dy.mv.spd + dy.ph);
    dy.m.position.set(dy.base.x + (dy.mv.ax||0)*k, dy.base.y, dy.base.z + (dy.mv.az||0)*k);
  }
  for (const sw of sweepers){
    sw.a += sw.w * dt; sw.g.rotation.y = sw.a;
    if (player.dead) continue;
    const feet = player.pos.y - sw.top;
    if (feet > 0.9 || feet < -2.5) continue;
    const dx = player.pos.x - sw.x, dz = player.pos.z - sw.z;
    const ca = Math.cos(sw.a), sa = Math.sin(sw.a);
    const along = dx*ca - dz*sa, perp = dx*sa + dz*ca;
    if (Math.abs(along) < sw.len/2 + 0.2 && Math.abs(perp) < 0.2 + R){
      const dir = Math.sign(sw.w * along) || 1;   // direction the bar is moving at that point (along +perp axis = -dir?)
      const px = sa, pz = ca;                     // world perpendicular axis
      const push = -dir;                          // bar tip velocity = w × r → pointing along -perp for +w*along
      player.pos.x = sw.x + along*ca + px*(push*(0.25+R));
      player.pos.z = sw.z - along*sa + pz*(push*(0.25+R));
      player.vel.x = px*push*11; player.vel.z = pz*push*11; player.vel.y = 6;
      player.grounded = false; player.ground = null; player.knock = 0.6; sfx.hit();
    }
  }
}

// ---------- physics ----------
const MOVE = 8, JUMP = 10.5, GRAV = 28;
const tmpF = new THREE.Vector3(), tmpR = new THREE.Vector3();
function updatePlayer(dt, t){
  const u = playerAvatar.userData;
  if (player.dead){
    player.deadT -= dt;
    player.vel.y -= GRAV*dt; player.pos.addScaledVector(player.vel, dt); playerAvatar.position.copy(player.pos);
    if (player.deadT <= 0) respawn();
    return;
  }
  // carry by moving platform
  if (player.grounded && player.ground){
    const m = player.ground.mesh.position;
    player.pos.x += m.x - player.ground.lastX; player.pos.z += m.z - player.ground.lastZ;
    if (player.ground.spin){ const a = player.ground.spin*dt, dx = player.pos.x - m.x, dz = player.pos.z - m.z, c = Math.cos(a), sn = Math.sin(a);
      player.pos.x = m.x + dx*c + dz*sn; player.pos.z = m.z - dx*sn + dz*c; player.facing += a; }
  }
  let ix = 0, iy = 0;
  if (G.state === 'playing'){
    if (keys.KeyW || keys.ArrowUp) iy += 1; if (keys.KeyS || keys.ArrowDown) iy -= 1;
    if (keys.KeyD || keys.ArrowRight) ix += 1; if (keys.KeyA || keys.ArrowLeft) ix -= 1;
    ix += joy.x; iy += joy.y;
  }
  let il = Math.hypot(ix, iy); if (il > 1){ ix /= il; iy /= il; il = 1; }
  if (il < 0.12){ ix = iy = 0; il = 0; }
  tmpF.set(-Math.sin(camYaw), 0, -Math.cos(camYaw)); tmpR.set(Math.cos(camYaw), 0, -Math.sin(camYaw));
  const tx = (tmpF.x*iy + tmpR.x*ix) * MOVE, tz = (tmpF.z*iy + tmpR.z*ix) * MOVE;
  player.knock -= dt;
  const acc = Math.min(1, dt * (player.knock > 0 ? 0.8 : player.grounded ? 14 : 5));
  player.vel.x += (tx - player.vel.x) * acc; player.vel.z += (tz - player.vel.z) * acc;
  if (player.grounded) player.coyote = 0.1; else player.coyote -= dt;
  if (jumpQueued && player.coyote > 0 && G.state === 'playing'){ player.vel.y = JUMP; player.grounded = false; player.ground = null; player.coyote = 0; sfx.jump(); }
  jumpQueued = false;
  player.vel.y -= GRAV * dt; if (player.vel.y < -40) player.vel.y = -40;
  const prevY = player.pos.y;
  player.pos.x += player.vel.x * dt; player.pos.z += player.vel.z * dt; player.pos.y += player.vel.y * dt;
  // collisions
  player.grounded = false; let newGround = null;
  for (const s of solids){
    if (!s.active) continue;
    const b = solidBounds(s);
    const ddx = player.pos.x - s.mesh.position.x, ddz = player.pos.z - s.mesh.position.z, dd = Math.hypot(ddx, ddz);
    const inXZ = s.disc ? dd < s.r + R*0.6 : (player.pos.x > b.minx - R*0.6 && player.pos.x < b.maxx + R*0.6 && player.pos.z > b.minz - R*0.6 && player.pos.z < b.maxz + R*0.6);
    if (inXZ && player.vel.y <= 0 && prevY >= b.top - 0.25 && player.pos.y <= b.top + 0.02){
      player.pos.y = b.top; player.vel.y = 0; player.grounded = true; newGround = s;
    } else if (s.disc){
      if (player.pos.y < b.top - 0.25 && player.pos.y + 2.8 > b.bottom && dd < s.r + R && dd > 1e-4){ const k = (s.r + R)/dd; player.pos.x = s.mesh.position.x + ddx*k; player.pos.z = s.mesh.position.z + ddz*k; }
    } else if (player.pos.y < b.top - 0.25 && player.pos.y + 2.8 > b.bottom){
      // side push
      const ox1 = (b.maxx + R) - player.pos.x, ox2 = player.pos.x - (b.minx - R);
      const oz1 = (b.maxz + R) - player.pos.z, oz2 = player.pos.z - (b.minz - R);
      if (ox1 > 0 && ox2 > 0 && oz1 > 0 && oz2 > 0){
        const mn = Math.min(ox1, ox2, oz1, oz2);
        if (mn === ox1) player.pos.x += ox1; else if (mn === ox2) player.pos.x -= ox2; else if (mn === oz1) player.pos.z += oz1; else player.pos.z -= oz2;
      }
    }
  }
  const landed = newGround && newGround !== player.ground;
  player.ground = newGround;
  if (landed && newGround.onLand) newGround.onLand();
  if (landed && newGround.tag === 'check' && player.checkpoint !== newGround){
    player.checkpoint = newGround; const b = solidBounds(newGround); player.spawn.set((b.minx+b.maxx)/2, b.top, (b.minz+b.maxz)/2);
    sfx.check(); showMsg('🚩 檢查點！', 1200, '#5dff8f');
  }
  if (player.grounded && newGround && newGround.tag === 'finish') completeLevel();
  if (!player.dead && player.pos.y < deathY) eliminate('掉下去了！', 'fall', 0.9);
  // avatar
  const hs = Math.hypot(player.vel.x, player.vel.z);
  if (hs > 0.5){ const target = Math.atan2(player.vel.x, player.vel.z); let d = target - player.facing; d = Math.atan2(Math.sin(d), Math.cos(d)); player.facing += d * Math.min(1, dt*12); }
  playerAvatar.position.copy(player.pos); playerAvatar.rotation.y = player.facing;
  animateAvatar(playerAvatar, hs, t, !player.grounded && Math.abs(player.vel.y) > 2);
}
function storeLast(){ for (const s of solids){ const p = s.mesh.position; s.lastX = p.x; s.lastY = p.y; s.lastZ = p.z; } }

// ---------- main loop ----------
let last = performance.now(), menuT = 0;
const camTarget = new THREE.Vector3();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  const t = now/1000;
  if (G.state === 'playing' || G.state === 'transition'){
    updateDynamics(dt, t);
    if (levelUpdate) levelUpdate(dt, t);
    updatePlayer(dt, t);
    storeLast();
    for (let i = shards.length-1; i >= 0; i--){ const s = shards[i]; s.v.y -= GRAV*0.6*dt; s.m.position.addScaledVector(s.v, dt); s.m.rotation.x += s.r.x*dt; s.m.rotation.y += s.r.y*dt; s.life -= dt; if (s.life <= 0){ s.m.parent && s.m.parent.remove(s.m); shards.splice(i,1); } }
    if (G.state === 'playing') $('time').textContent = ((performance.now() - G.runStart)/1000).toFixed(1);
  } else if (G.state === 'menu' && !levelGroup){
    loadLevel(1); G.state = 'menu';
  } else if (G.state === 'menu'){
    menuT += dt; camYaw = Math.sin(menuT*0.2)*0.6; updateDynamics(dt, t);
  }
  camTarget.set(player.pos.x, Math.max(player.pos.y, deathY + 4) + 2.2, player.pos.z);
  const cp = Math.cos(camPitch);
  camera.position.set(camTarget.x + Math.sin(camYaw)*cp*camDist, camTarget.y + Math.sin(camPitch)*camDist, camTarget.z + Math.cos(camYaw)*cp*camDist);
  camera.lookAt(camTarget);
  sun.position.set(player.pos.x + 15, player.pos.y + 35, player.pos.z + 12); sun.target.position.copy(player.pos);
  renderer.render(scene, camera);
}
